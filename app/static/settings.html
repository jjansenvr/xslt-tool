<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XSLT Tester instellingen</title>
  <style>
    html, body { margin: 0; background: #1e1e1e; color: #ccc; font: 13px system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 16px; padding: 8px 12px; background: #252526; border-bottom: 1px solid #333; }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    header a { color: #ccc; text-decoration: none; }
    header a:hover { color: #fff; }
    main { padding: 16px 24px; max-width: 600px; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #bbb; }
    label { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; font-family: monospace; font-size: 14px; }
    .hint { color: #888; }
    .ok { color: #89d185; }
  </style>
</head>
<body>
  <header>
    <a href="./">← Terug</a>
    <h1>Instellingen</h1>
  </header>
  <main>
    <h2>Saxon-HE versie voor de mapping</h2>
    <div id="versions"></div>
    <p id="saved" class="ok"></p>
    <p class="hint">Extra versies voeg je toe door een map met de Saxon-HE jar (en eventuele dependencies)
      in <code>/opt/saxon/&lt;versie&gt;</code> te zetten, bijvoorbeeld via een volume.</p>
  </main>
  <script>
    fetch('/api/saxon-versions').then(r => r.json()).then(({ versions, default: def }) => {
      let current = '';
      try { current = localStorage.getItem('saxonVersion') || ''; } catch {}
      if (!versions.includes(current)) current = def;

      const box = document.getElementById('versions');
      for (const v of versions) {
        const label = document.createElement('label');
        label.innerHTML = `<input type="radio" name="saxon"> Saxon-HE ${v}${v === def ? ' <span class="hint">(standaard)</span>' : ''}`;
        const radio = label.querySelector('input');
        radio.value = v;
        radio.checked = v === current;
        radio.onchange = () => {
          try { localStorage.setItem('saxonVersion', v); } catch {}
          document.getElementById('saved').textContent = `✓ Saxon-HE ${v} wordt gebruikt`;
        };
        box.appendChild(label);
      }
    });
  </script>
</body>
</html>
