name: Build and publish Docker image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bundle-windows:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows bundle
        run: ./packaging/build-windows.ps1 -Version "${{ github.event.release.tag_name }}"

      - name: Start bundle
        shell: pwsh
        run: |
          $zip = Resolve-Path dist/xslt-tool-windows-*.zip
          Expand-Archive $zip "$env:RUNNER_TEMP/bundle"
          $env:NO_BROWSER = "1"
          Start-Process "$env:RUNNER_TEMP/bundle/xslt-tool/start.bat" -WorkingDirectory "$env:RUNNER_TEMP/bundle/xslt-tool" -WindowStyle Hidden
          for ($i = 0; $i -lt 30; $i++) {
            try { Invoke-WebRequest http://localhost:8080/api/saxon-versions -UseBasicParsing | Out-Null; exit 0 } catch { Start-Sleep 1 }
          }
          exit 1

      - name: Run integration tests against bundle
        run: |
          pip install -r requirements-dev.txt
          pytest tests/integration -v

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xslt-tool-windows-${{ github.event.release.tag_name }}
          path: dist/xslt-tool-windows-*.zip
          if-no-files-found: error

      - name: Attach bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" (Resolve-Path dist/xslt-tool-windows-*.zip) --clobber
